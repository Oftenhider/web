    <title>oftenhider</title>
    <script id="discord:component-embed" type="application/json">
      {
        "component": {
          "type": 17,
          "accent_color": 16777215,

              "type": 10,

            },

              "components": [
                { "type": 2, "style": 5, "url": "https://x.com/oftenhider", "label": "twitter" },
                { "type": 2, "style": 5, "url": "https://github.com/oftenhider", "label": "github" },
                { "type": 2, "style": 5, "url": "https://discord.com/users/1514279001181651045", "label": "discord" }
              ]

        }

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="content" aria-labelledby="name">
        <h1 id="name">oftenhider</h1>
        <section class="live-panel" aria-label="current weather and time in częstochowa">
          <div class="weather-readout" aria-live="polite">
            <span class="weather-icon" id="weather-icon" aria-hidden="true">○</span>
            <span class="live-value" id="weather">--°c</span>
          </div>
          <span class="live-divider" aria-hidden="true"></span>
          <time class="live-value" id="clock">--:--</time>
        </section>
        <div class="lower">
          <div class="bio">
            <img class="pfp" src="pfp.svg" alt="oftenhider profile picture" width="250" height="250" />
            <p class="about">hi, i'm oftenhider, a person from częstochowa, poland. i don't have anything to show off (for now) so go follow me on social media</p>
          </div>
          <nav class="links" aria-label="social links">
            <a class="icon-link" data-name="twitter" href="https://x.com/oftenhider" target="_blank" rel="me noreferrer" aria-label="twitter: @oftenhider"><img src="x.svg" alt="" /></a>
            <a class="icon-link" data-name="github" href="https://github.com/oftenhider" target="_blank" rel="me noreferrer" aria-label="github: oftenhider"><img src="github.svg" alt="" /></a>
            <a class="icon-link" data-name="discord" href="https://discord.com/users/1514279001181651045" target="_blank" rel="me noreferrer" aria-label="discord: @oftenhider"><img src="discord.svg" alt="" /></a>
            <a class="icon-link" data-name="tiktok" href="https://www.tiktok.com/@oftenhider" target="_blank" rel="me noreferrer" aria-label="tiktok: @oftenhider"><img src="tiktok.svg" alt="" /></a>
            <a class="icon-link" data-name="youtube" href="https://www.youtube.com/@oftenhider" target="_blank" rel="me noreferrer" aria-label="youtube: @oftenhider"><img src="youtube.svg" alt="" /></a>
            <a class="icon-link" data-name="instagram" href="https://www.instagram.com/oftenhider" target="_blank" rel="me noreferrer" aria-label="instagram: @oftenhider"><img src="instagram.svg" alt="" /></a>
          </nav>
        </div>
      </section>
    </main>
    <script>
      const clock = document.getElementById('clock');
      const weather = document.getElementById('weather');
      const weatherIcon = document.getElementById('weather-icon');
      const weatherLabels = { 0: 'clear', 1: 'mostly clear', 2: 'partly cloudy', 3: 'overcast', 45: 'foggy', 48: 'foggy', 51: 'drizzle', 53: 'drizzle', 55: 'drizzle', 61: 'rain', 63: 'rain', 65: 'heavy rain', 71: 'snow', 73: 'snow', 75: 'heavy snow', 80: 'showers', 81: 'showers', 82: 'heavy showers', 95: 'thunderstorm' };
      const weatherIcons = { 0: '☀', 1: '☀', 2: '⛅', 3: '☁', 45: '≋', 48: '≋', 51: '☂', 53: '☂', 55: '☂', 61: '☂', 63: '☂', 65: '☂', 71: '❄', 73: '❄', 75: '❄', 80: '☂', 81: '☂', 82: '☂', 95: '⚡' };
      const updateClock = () => { clock.textContent = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Warsaw', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date()); };
      updateClock();
      window.setInterval(updateClock, 1000);
      const loadWeather = async () => {
        weather.textContent = '--°c';
        try {
          const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=50.8083&longitude=19.1272&current=temperature_2m,weather_code');
          if (!response.ok) throw new Error('weather request failed');
          const data = await response.json();
          const current = data.current;
          weatherIcon.textContent = weatherIcons[current.weather_code] || '○';
          weatherIcon.title = weatherLabels[current.weather_code] || 'weather';
          weather.textContent = Math.round(current.temperature_2m) + '°c';
        } catch { weather.textContent = '—'; }
      };
      loadWeather();
    </script>
  </body>
</html>
